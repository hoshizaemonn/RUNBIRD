<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWL 0円プラン FV（ボタンHTML化・プレビュー）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#eef1f4;color:#2b2b2b}
.note{max-width:520px;margin:16px auto 0;padding:10px 16px;font-size:13px;color:#556;background:#fff;border-radius:8px;text-align:center}

/* ===== FV 本体 ===== */
.fv{position:relative;width:100%;max-width:520px;margin:16px auto;
    aspect-ratio:941/1672;background:#fafaf5;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.12)}
.fv>img{display:block;width:100%;height:100%;object-fit:cover}

/* 上部オレンジ：無料資料請求（ピル） */
.fv .cta-top{position:absolute;top:2.1%;right:3.2%;
    display:inline-flex;align-items:center;gap:.35em;
    background:#f5843c;color:#fff;font-weight:700;text-decoration:none;
    font-size:clamp(11px,3.1vw,15px);padding:.62em 1.15em;border-radius:999px;
    box-shadow:0 3px 10px rgba(245,132,60,.4);transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
    white-space:nowrap}
.fv .cta-top:hover{background:#e8731f;transform:translateY(-1px);box-shadow:0 5px 14px rgba(245,132,60,.5)}
.fv .cta-top:active{transform:translateY(0) scale(.98)}
.fv .cta-top .chev{font-size:1.05em;line-height:1}

/* 下部グリーン：メインCTA */
.fv .cta-main{position:absolute;left:50%;bottom:2.6%;transform:translateX(-50%);
    width:90%;display:flex;align-items:center;justify-content:center;gap:.4em;
    background:linear-gradient(180deg,#46a046 0%,#3d8b3d 100%);color:#fff;text-decoration:none;
    font-weight:800;font-size:clamp(18px,5.6vw,30px);letter-spacing:.02em;
    padding:.66em 0;border-radius:14px;
    box-shadow:0 6px 18px rgba(61,139,61,.42);
    transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;
    animation:pulse 2.4s ease-in-out infinite}
.fv .cta-main:hover{filter:brightness(1.05);transform:translateX(-50%) translateY(-2px);box-shadow:0 10px 26px rgba(61,139,61,.5);animation:none}
.fv .cta-main:active{transform:translateX(-50%) translateY(0) scale(.99)}
.fv .cta-main .play{font-size:.8em;line-height:1}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(61,139,61,.42)}50%{box-shadow:0 6px 26px rgba(61,139,61,.75)}}

@media(prefers-reduced-motion:reduce){.fv .cta-main{animation:none}}
</style>
</head>
<body>
<div class="note">▼ ボタンは画像から抜いて HTML/CSS 化（ホバー・押下アニメ付き・クリック計測可能）。緑CTAは注目のため軽く点滅します。</div>

<div class="fv">
  <img src="assets/fv_a_clean.webp" alt="加盟金0円で、月商300万モデルへ。開設実績400件／全国47都道府県／独立支援10年以上">
  <a class="cta-top" href="#contact">無料資料請求<span class="chev">›</span></a>
  <a class="cta-main" href="#contact"><span class="play">▶</span>無料で資料請求</a>
</div>

</body>
</html>
