    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // silently dropped. Inlining makes it a plain inline babel script,

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

"screen-result-msg\" id=\"screen-result-msg\"><\u002Fp>\n        <a href=\"#form\" class=\"cta-btn\" data-cta=\"diagnostic\" data-ab-variant=\"A\" onclick=\"dataLayer.push({event:'cta_click', variant:'A', cta:'diagnostic', from:'screening'})\">\n          無料診断を受ける <span class=\"arw\">›<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- S03 今、動くべき理由 -->\n  <section class=\"section\" id=\"about\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s03_sp.webp\"><img src=\"assets/s03_pc.webp\" alt=\"2026年、業界の転換点。2つの制度改定をチャンスに。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S04 収益シミュレーション -->\n  <section class=\"section\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s04_sp.webp\"><img src=\"assets/s04_pc.webp\" alt=\"1棟から4棟まで、段階的に伸びる収益シミュレーション。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S05 初期投資の内訳 -->\n  <section class=\"section\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s05_sp.webp\"><img src=\"assets/s05_pc.webp\" alt=\"物件取得費×内装費で決まる初期投資の内訳。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S06 加盟プラン比較 -->\n  <section class=\"section\" id=\"plan\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s06_sp.webp\"><img src=\"assets/s06_pc.webp\" alt=\"0円プランと加盟金プランの決定的な違い。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S07 4ペルソナ診断（A版：前面） -->\n  <section class=\"section\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s07_sp.webp\"><img src=\"assets/s07_pc.webp\" alt=\"こんな方がOWLで独立起業しています。4つのキャリア類型。\" loading=\"lazy\"></picture><\u002Fsection>\n\n  <!-- CTA #3：S07直下（動機付けピーク直後） -->\n  <div class=\"cta-block\">\n    <p class=\"lead\">あなたのキャリアがどう活きるか、まずは無料診断で。<\u002Fp>\n    <a href=\"#form\" class=\"cta-btn\" data-cta=\"diagnostic\" data-ab-variant=\"A\" onclick=\"dataLayer.push({event:'cta_click', variant:'A', cta:'diagnostic'})\">\n      無料診断を受ける <span class=\"arw\">›<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <!-- S08 実際の開業事例 -->\n  <section class=\"section\" id=\"case\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s08_sp.webp\"><img src=\"assets/s08_pc.webp\" alt=\"OWLで独立起業した4名のリアルな声。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S10 実績・信頼 -->\n  <section class=\"section\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s10_sp.webp\"><img src=\"assets/s10_pc.webp\" alt=\"180社の開業実績。国給付85%の安定収益。\" loading=\"lazy\"></picture><\u002Fsection>\n  <!-- S11 6ステップ -->\n  <section class=\"section\"><picture><source media=\"(max-width: 768px)\" srcset=\"assets/s11_sp.webp\"><img src=\"assets/s11_pc.webp\" alt=\"資料請求から開設・半年以内黒字化まで、6ステップ。\" loading=\"lazy\"></picture><\u002Fsection>\n\n  <!-- CTA #4：S11直下（ステップ理解した直後） -->\n  <div class=\"cta-block\">\n    <p class=\"lead\">開設までの流れがイメージできたら、次はあなたの番です。<\u002Fp>\n    <a href=\"#form\" class=\"cta-btn\" data-cta=\"diagnostic\" data-ab-variant=\"A\" onclick=\"dataLayer.push({event:'cta_click', variant:'A', cta:'diagnostic'})\">\n      無料診断を受ける <span class=\"arw\">›<\u002Fspan>\n    <\u002Fa>\n    <p class=\"note\">診断は約1分。しつこい営業は一切ありません。<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- S09 FAQ アコーディオン -->\n  <section class=\"section faq\" id=\"faq\">\n    <div class=\"wrap\">\n      <h2 class=\"sec-title\">よくあるご質問<\u002Fh2>\n      <div class=\"faq-list\">\n        <details class=\"faq-item\">\n          <summary>未経験でも本当に開業できますか？<\u002Fsummary>\n          <p>可能です。180社の実績のうち約6割は福祉未経験からのスタートです。専任のスーパーバイザーが行政対応から入居者募集まで伴走します。<\u002Fp>\n        <\u002Fdetails>\n        <details class=\"faq-item\">\n          <summary>0円プランと加盟金プラン、どちらがいい？<\u002Fsummary>\n          <p>初期資金を物件・内装に集中させたい方は0円プラン（月々16.5万×36ヶ月）、シンプルな契約体系を望む方は加盟金プラン（440万円）がおすすめです。<\u002Fp>\n        <\u002Fdetails>\n        <details class=\"faq-item\">\n          <summary>開業までの期間はどのくらい？<\u002Fsummary>\n          <p>最短3ヶ月〜半年です。融資組成方式・物件形態・工事規模・自治体タイミング等により変動します。<\u002Fp>\n        <\u002Fdetails>\n        <details class=\"faq-item\">\n          <summary>融資は本当に受けられますか？<\u002Fsummary>\n          <p>金融機関との交渉支援を含みます。実績4社の連携先で、事業計画書作成から金利交渉までサポートします。<\u002Fp>\n        <\u002Fdetails>\n        <details class=\"faq-item\">\n          <summary>開業後のサポートは？<\u002Fsummary>\n          <p>行政対応・入居者募集・請求業務・スタッフ研修まで運営サポート付き。半年以内の黒字化を目標に伴走します。<\u002Fp>\n        <\u002Fdetails>\n        <details class=\"faq-item\">\n          <summary>資料請求・診断は無料ですか？<\u002Fsummary>\n          <p>はい、完全無料です。しつこい営業もいたしません。まずは事業内容をご確認ください。<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- S12 資料請求フォーム -->\n  <section class=\"form-section\" id=\"form\">\n    <div class=\"form-wrap\">\n      <div class=\"form-head\">\n        <span class=\"eyebrow\">FREE 無料診断<\u002Fspan>\n        <h2>あなたに合った開業プランを<br><span class=\"hl\">無料診断<\u002Fspan>します<\u002Fh2>\n        <p>入力は3項目・約1分。担当者よりご連絡いたします。<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"form-card\">\n        <form id=\"lp-form\" novalidate=\"\">\n          <div class=\"field\">\n            <label for=\"name\">お名前<span class=\"req\">必須<\u002Fspan><\u002Flabel>\n            <input type=\"text\" id=\"name\" name=\"name\" autocomplete=\"name\" placeholder=\"山田 太郎\" required=\"\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"email\">メールアドレス<span class=\"req\">必須<\u002Fspan><\u002Flabel>\n            <input type=\"email\" id=\"email\" name=\"email\" autocomplete=\"email\" placeholder=\"example@owl-fukushi.net\" required=\"\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"tel\">電話番号<span class=\"req\">必須<\u002Fspan><\u002Flabel>\n            <input type=\"tel\" id=\"tel\" name=\"tel\" autocomplete=\"tel\" placeholder=\"090-1234-5678\" required=\"\">\n          <\u002Fdiv>\n          <!-- CTA #5：フォーム本体 -->\n          <button type=\"submit\" class=\"cta-btn\" data-cta=\"diagnostic\" data-ab-variant=\"A\" onclick=\"dataLayer.push({event:'cta_click', variant:'A', cta:'diagnostic'})\">\n            無料診断を受ける <span class=\"arw\">›<\u002Fspan>\n          <\u002Fbutton>\n          <p class=\"form-note\">送信いただいた情報は個人情報保護方針に基づき厳重に管理し、<br>ご連絡・資料送付の目的以外には使用いたしません。<\u002Fp>\n        <\u002Fform>\n        <div class=\"form-thanks\" id=\"form-thanks\">\n          <h3>送信ありがとうございました<\u002Fh3>\n          <p>担当者より2営業日以内にご連絡いたします。<br>今しばらくお待ちください。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- ===== Footer ===== -->\n<footer class=\"footer\">\n  <div class=\"footer-inner\">\n    <div class=\"footer-top\">\n      <div>\n        <div class=\"brand\"><img src=\"4ff39593-a855-4f42-ad41-85f7ebcb0fcc\" alt=\"OWL\" class=\"brand-logo\"><\u002Fdiv>\n        <p class=\"company\">\n          株式会社OWL<br>\n          障がい者グループホーム 開業・運営支援事業<br>\n          〒000-0000 ○○県○○市○○ 0-0-0<br>\n          TEL 000-000-0000（受付 平日10:00–18:00）\n        <\u002Fp>\n      <\u002Fdiv>\n      <nav class=\"footer-links\" aria-label=\"フッター\">\n        <a href=\"#form\">無料診断・資料請求<\u002Fa>\n        <a href=\"#top\">ページトップへ<\u002Fa>\n        <a href=\"/privacy/\">プライバシーポリシー<\u002Fa>\n        <a href=\"/company/\">運営会社<\u002Fa>\n        <a href=\"/contact/\">お問い合わせ<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <span>© 2026 OWL Inc. All rights reserved.<\u002Fspan>\n      <span>掲載の収益・費用は標準的な参考モデルであり、棟数・地域・入居率等により変動します。<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ===== Floating CTA (mobile) ===== -->\n<div class=\"floating-cta\">\n  <a href=\"#form\" class=\"cta-btn\" data-cta=\"diagnostic\" data-ab-variant=\"A\" onclick=\"dataLayer.push({event:'cta_click', variant:'A', cta:'diagnostic'})\">\n    無料診断を受ける（無料・約1分）\n  <\u002Fa>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var form = document.getElementById('lp-form');\n  if(!form) return;\n  form.addEventListener('submit', function(e){\n    e.preventDefault();\n    if(!form.checkValidity()){ form.reportValidity(); return; }\n    dataLayer.push({event:'form_submit', variant:'A', cta:'diagnostic'});\n    // TODO: 本番では送信先エンドポイントへ POST してください\n    document.getElementById('lp-form').style.display='none';\n    document.getElementById('form-thanks').style.display='block';\n  });\n})();\n\n(function(){\n  var cards = document.querySelectorAll('.screening .screen-card');\n  var result = document.getElementById('screen-result');\n  var msg = document.getElementById('screen-result-msg');\n  if(!cards.length || !result) return;\n  var answers = {};\n  cards.forEach(function(card){\n    var q = card.getAttribute('data-q');\n    card.querySelectorAll('.choice').forEach(function(btn){\n      btn.addEventListener('click', function(){\n        card.querySelectorAll('.choice').forEach(function(b){b.classList.remove('active');});\n        btn.classList.add('active');\n        answers[q] = btn.getAttribute('data-a');\n        if(Object.keys(answers).length === cards.length){\n          var allYes = Object.keys(answers).every(function(k){return answers[k]==='yes';});\n          msg.textContent = allYes\n            ? 'あなたはOWLに適性あり！資料請求へ'\n            : 'まずは資料で情報収集からがおすすめ';\n          result.hidden = false;\n        }\n      });\n    });\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
