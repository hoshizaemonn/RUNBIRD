name: Update Dashboard HTML

on:
  push:
    branches: [gh-pages-clean]
    paths: ['data/*.json']

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find latest JSON and update dashboard
        run: |
          LATEST=$(ls data/*.json | sort -r | head -1)
          echo "Updating dashboard from: $LATEST"
          python3 update_dashboard.py --from-json "$LATEST"

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          LATEST=$(ls data/*.json | sort -r | head -1)
          git commit -m "Auto-update dashboard from $LATEST"
          git push
