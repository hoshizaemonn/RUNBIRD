<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>テロップ テンプレート集</title>
<style>
:root{--bg:#f4f2ee;--ink:#1d1b19;--sub:#6b6660;--line:#ddd8d0;--card:#fff;--acc:#2f6f5e;--brand:#2f6f5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:150px}
header{padding:24px 20px 8px;max-width:1500px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--sub);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,242,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1500px;margin:0 auto;padding:10px 20px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row b{font-size:12px;color:var(--sub);min-width:52px;font-weight:600}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--sub);margin-left:4px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on small{color:#cfcac2}
input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;width:min(420px,60vw)}select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;background:#fff}
main{max-width:1500px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.10)}.card.sel{outline:3px solid var(--acc);outline-offset:-1px}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;container-type:size}
.stage.dark{background:linear-gradient(115deg,#1f1c1b 0%,#3a302a 45%,#5d4c3e 100%)}
.stage.mid{background:linear-gradient(115deg,#5a524a 0%,#8e8172 50%,#b3a38e 100%)}
.stage.light{background:linear-gradient(115deg,#cdc5ba 0%,#e9e3da 55%,#f7f4ee 100%)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 72% 30%,rgba(255,255,255,.16),transparent 70%)}
.telop{position:absolute;white-space:nowrap;line-height:1.42;font-size:calc(var(--h) * 100cqh / 0.78)}
.telop.c{left:50%;transform:translate(-50%,-50%);text-align:center}.telop.l{transform:translate(0,-50%);text-align:left}.telop.r{transform:translate(-100%,-50%);text-align:right}
.mv{position:relative;display:inline-block}
.band{position:absolute;z-index:0}.lay{position:relative;z-index:1;display:block}.lay.under{position:absolute;inset:0;z-index:1}
.c{display:inline-block;white-space:pre}
.meta{padding:9px 12px 11px}.meta h3{margin:0;font-size:13.5px;font-weight:600}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:#efece6;color:#4d4842}.tag.n{background:#e3efe9;color:#1f5a49}.tag.z{background:#f4e9e6;color:#8a3b2b}.tag.lab{background:#eef0f6;color:#3a4a78}
.ex{margin-top:5px;font-size:11px;color:var(--sub)}.ex a{color:#3a5fa8;margin-right:6px;text-decoration:none}.ex a:hover{text-decoration:underline}
.tray{position:fixed;left:0;right:0;bottom:0;background:#1d1b19;color:#fff;z-index:9;padding:10px 20px}
.tray .in{max-width:1500px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pick{background:#33302c;border-radius:8px;padding:5px 10px;font-size:12px;min-width:150px}.pick b{display:block;font-size:11px;color:#b9b2a8;font-weight:500}.pick.empty{opacity:.45}
.pick .x{cursor:pointer;color:#e0a59a;margin-left:6px}
button{background:#fff;color:#1d1b19;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}button.sub{background:#4a4640;color:#fff}
#msg{font-size:12px;color:#b8e0c8}
@media(max-width:760px){.bar{position:static}.pick.empty{display:none}.pick{min-width:0}.tray{padding:8px 12px}main{padding:12px;grid-template-columns:1fr}}
/* ---- 出方 ---- */
.go.m-fade .mv{animation:fade var(--d) ease-out both}
.go.m-pop .mv{animation:pop var(--d) cubic-bezier(.3,1.7,.5,1) both}
.go.m-zoom_out .mv{animation:zoomout var(--d) cubic-bezier(.2,.9,.2,1) both}
.go.m-blur_in .mv{animation:blurin var(--d) ease-out both}
.go.m-wipe .mv,.go.m-flash .mv{animation:wipe var(--d) cubic-bezier(.2,.8,.2,1) both}
.go.m-slide_up .mv{animation:sup var(--d) cubic-bezier(.2,.8,.2,1) both}.go.m-slide_down .mv{animation:sdown var(--d) cubic-bezier(.2,.8,.2,1) both}
.go.m-slide_left .mv{animation:sleft var(--d) cubic-bezier(.2,.8,.2,1) both}.go.m-slide_right .mv{animation:sright var(--d) cubic-bezier(.2,.8,.2,1) both}
.go.m-typewriter .c{opacity:0;animation:on .01s linear both;animation-delay:calc(var(--i) / var(--n) * var(--d))}
.go.m-char_pop .c{opacity:0;animation:cpop .28s cubic-bezier(.3,1.9,.5,1) both;animation-delay:calc(var(--i) / var(--n) * var(--d))}
.go.m-band_first .band{animation:wipe calc(var(--d) * .5) cubic-bezier(.2,.8,.2,1) both}.go.m-band_first .lay{animation:sup calc(var(--d) * .6) ease-out both;animation-delay:calc(var(--d) * .4)}
.go.m-line_draw .mv::after{content:"";position:absolute;left:0;right:0;bottom:-.12em;height:.045em;background:currentColor;transform-origin:left;animation:line calc(var(--d) * .5) cubic-bezier(.2,.8,.2,1) both}
.go.m-line_draw .lay,.go.m-line_draw .band{animation:sup calc(var(--d) * .55) ease-out both;animation-delay:calc(var(--d) * .45)}
.go.m-flash .mv::after{content:"";position:absolute;top:-.2em;bottom:-.2em;width:1.4em;left:0;background:rgba(255,255,255,.92);transform:skewX(-20deg);filter:blur(.05em);animation:streak var(--d) cubic-bezier(.2,.8,.2,1) both;z-index:3}
.go.m-tracking .mv{animation:track var(--d) cubic-bezier(.2,.8,.2,1) both}
.go.m-open_v .mv{animation:openv var(--d) cubic-bezier(.2,.8,.2,1) both}
.go.m-glitch .mv{animation:glitch var(--d) steps(1) both}
.go.a-shine .mv::before{content:"";position:absolute;top:-.2em;bottom:-.2em;width:1.2em;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);mix-blend-mode:screen;animation:streak .5s ease-in-out both;animation-delay:var(--d);z-index:3;opacity:0}
@keyframes fade{from{opacity:0}}@keyframes on{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{transform:scale(1)}}
@keyframes cpop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes zoomout{0%{opacity:0;transform:scale(1.9)}45%{opacity:1}100%{transform:scale(1)}}
@keyframes blurin{0%{opacity:0;filter:blur(.35em)}70%{opacity:1}100%{filter:blur(0)}}
@keyframes wipe{from{clip-path:inset(-50% 100% -50% -200%)}to{clip-path:inset(-50% -200% -50% -200%)}}
@keyframes sup{from{opacity:0;transform:translateY(.9em)}}@keyframes sdown{from{opacity:0;transform:translateY(-.9em)}}
@keyframes sleft{from{opacity:0;transform:translateX(2em)}}@keyframes sright{from{opacity:0;transform:translateX(-2em)}}
@keyframes line{from{transform:scaleX(0)}}
@keyframes streak{0%{left:-1.5em;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:100%;opacity:0}}
@keyframes track{from{opacity:0;letter-spacing:.9em}}
@keyframes openv{0%{opacity:0;transform:scaleY(.04)}25%{opacity:1}100%{transform:scaleY(1)}}
@keyframes glitch{0%{opacity:0}10%{opacity:1;transform:translateX(.3em);filter:drop-shadow(-.25em 0 #0ff) drop-shadow(.25em 0 #f00)}30%{transform:translateX(-.25em);filter:drop-shadow(.2em 0 #0ff) drop-shadow(-.2em 0 #f00)}50%{transform:translateX(.12em);filter:drop-shadow(-.1em 0 #0ff) drop-shadow(.1em 0 #f00)}75%{transform:translateX(-.05em);filter:drop-shadow(.05em 0 #0ff)}100%{transform:none;filter:none}}
</style></head><body>
<header><h1>テロップ テンプレート集</h1>
<p>ランバードの実写PR動画 143本（うち制作実績シート「事例 業種別」31本）を目視して起こした型です。見た目 41種 × 出方 19種。カードを押すと選べます（役割ごとに1つ）。</p></header>
<div class="bar"><div class="in">
<div class="row"><b>文字</b><input id="txt" type="text" placeholder="ここに入れた文字で全部のカードを試す（{ } で強調）"><b style="min-width:auto;margin-left:10px">色</b><input id="brand" type="color" value="#2f6f5e"><b style="min-width:auto;margin-left:10px">背景</b><select id="bg"><option value="">型ごとのおすすめ</option><option value="dark">暗い</option><option value="mid">中間</option><option value="light">明るい</option></select><b style="min-width:auto;margin-left:10px">作風</b><select id="lab"><option value="">すべて</option></select></div>
<div class="row" id="roles"><b>役割</b></div><div class="row" id="moods"><b>雰囲気</b></div><div class="row" id="motions"><b>出方</b></div>
</div></div>
<main id="grid"></main>
<div class="tray"><div class="in"><div id="picks" style="display:flex;gap:8px;flex-wrap:wrap;flex:1"></div><span id="msg"></span><button class="sub" id="clear">選択を消す</button><button id="copy">選んだ組をコピー</button></div></div>

function play(t){ t.classList.remove("go","m-"+t.dataset.m,"a-"+t.dataset.a); void t.offsetWidth; t.classList.add("go","m-"+t.dataset.m); if(t.dataset.a)t.classList.add("a-"+t.dataset.a) }
function render(){
  const g=$("#grid"); g.innerHTML="";
  STYLES.filter(s=>(!S.role||s.role===S.role)&&(!S.mood||s.mood===S.mood)&&(!S.lab||s.labels.includes(S.lab))).forEach(st=>{
    const c=el("div","card"+(S.pick[st.role]&&S.pick[st.role].style===st.id?" sel":"")); const sg=el("div","stage "+(S.bg||st.demo_bg||"mid"));
    const t=telop(st,S.text||st.sample,S.motion); sg.appendChild(t); c.appendChild(sg);
    const mo=MOTIONS.find(m=>m.id===(S.motion||st.motion));
    const ex=st.examples.map((id,i)=>`<a href="https://youtu.be/${id}" target="_blank" rel="noopener">実例${i+1}</a>`).join("");
    c.appendChild(el("div","meta",`<h3>${st.id}　${st.name}</h3><div class="tags"><span class="tag">${ROLE[st.role]}</span><span class="tag">${MOOD[st.mood]}</span><span class="tag ${st.n_videos? "n":"z"}">近い型の実写 ${st.n_videos}本</span><span class="tag">出方: ${mo.name}</span>${st.labels.map(l=>`<span class="tag lab">${l}</span>`).join("")}</div>${ex?`<div class="ex">${ex}</div>`:""}`));
    c.addEventListener("click",e=>{ if(e.target.tagName==="A")return; const cur=S.pick[st.role]; if(cur&&cur.style===st.id)delete S.pick[st.role]; else S.pick[st.role]={style:st.id,motion:S.motion||st.motion}; tray(); render() });
    c.addEventListener("mouseenter",()=>play(t)); g.appendChild(c); play(t) }) }
function chips(host,items,key,all){ const h=$(host); const mk=(v,label,sm)=>{const b=el("span","chip"+(S[key]===v?" on":""),label+(sm!=null?`<small>${sm}</small>`:""));b.onclick=()=>{S[key]=v;build();render()};h.appendChild(b)}; [...h.querySelectorAll(".chip")].forEach(x=>x.remove()); mk("",all); items.forEach(i=>mk(i[0],i[1],i[2])) }
function build(){
  chips("#roles",Object.entries(ROLE).map(([k,v])=>[k,v,STYLES.filter(s=>s.role===k).length]),"role","すべて");
  chips("#moods",Object.entries(MOOD).map(([k,v])=>[k,v,STYLES.filter(s=>s.mood===k).length]),"mood","すべて");
  chips("#motions",MOTIONS.map(m=>[m.id,m.name,m.n+"件"]),"motion","型ごとのおすすめ") }
function tray(){ const p=$("#picks"); p.innerHTML=""; Object.entries(ROLE).forEach(([k,v])=>{ const x=S.pick[k]; const st=x&&STYLES.find(s=>s.id===x.style), mo=x&&MOTIONS.find(m=>m.id===x.motion);
  const d=el("div","pick"+(x?"":" empty"),`<b>${v}</b>${x?`${st.id} ${st.name.split("｜")[1]}<br>${mo.id} ${mo.name}<span class="x" data-k="${k}">✕</span>`:"未選択"}`); p.appendChild(d) });
  p.querySelectorAll(".x").forEach(x=>x.onclick=()=>{delete S.pick[x.dataset.k];tray();render()}) }
$("#copy").onclick=()=>{ const set={brand:S.brand}; Object.entries(S.pick).forEach(([k,v])=>set[k]=v); if(Object.keys(set).length<2){$("#msg").textContent="カードを押して選んでください";return}
  const lines=Object.entries(S.pick).map(([k,v])=>`${ROLE[k]}: ${v.style}（${STYLES.find(s=>s.id===v.style).name.split("｜")[1]}）＋ ${v.motion}（${MOTIONS.find(m=>m.id===v.motion).name}）`).join("\n");
  const out=`テロップはこの組み合わせで焼いてください。\n${lines}\nブランド色: ${S.brand}\n\ntelop_set = ${JSON.stringify(set)}`;
  navigator.clipboard.writeText(out).then(()=>{$("#msg").textContent="コピーしました"},()=>{prompt("コピーしてください",out)}) };
$("#clear").onclick=()=>{S.pick={};tray();render()};
$("#txt").oninput=e=>{S.text=e.target.value;render()}; $("#brand").oninput=e=>{S.brand=e.target.value;render()}; $("#bg").onchange=e=>{S.bg=e.target.value;render()};
const labs=[...new Set(STYLES.flatMap(s=>s.labels))].sort(); labs.forEach(l=>{const o=el("option",null,l);o.value=l;$("#lab").appendChild(o)}); $("#lab").onchange=e=>{S.lab=e.target.value;render()};
build(); tray(); render(); setInterval(()=>document.querySelectorAll(".telop").forEach(play),4200);
</script></body></html>
